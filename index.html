<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>For My Sunshine</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Comic Sans MS", "Trebuchet MS", cursive;
      background:
        radial-gradient(circle at top left, #fff1f5, transparent 35%),
        radial-gradient(circle at bottom right, #ffe9c9, transparent 35%),
        linear-gradient(135deg, #fff7e6, #ffe6ef);
      overflow-x: hidden;
      color: #6b3e4a;
    }

    #lock-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background:
        radial-gradient(circle at top left, #fff1f5, transparent 35%),
        radial-gradient(circle at bottom right, #ffe9c9, transparent 35%),
        linear-gradient(135deg, #fff7e6, #ffe6ef);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lock-card {
      width: min(390px, 92vw);
      padding: 32px 24px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 20px 50px rgba(217, 95, 141, 0.25);
      text-align: center;
    }

    .lock-card h1 {
      margin: 0 0 10px;
      color: #d95f8d;
      font-size: 2rem;
    }

    .lock-card p {
      color: #8a5a64;
    }

    .lock-card input {
      width: 100%;
      margin: 16px 0 12px;
      padding: 13px 15px;
      border-radius: 999px;
      border: 2px solid #f3a6bd;
      outline: none;
      font: inherit;
      text-align: center;
      color: #6b3e4a;
    }

    .lock-card button {
      width: 100%;
      padding: 13px 15px;
      border: 0;
      border-radius: 999px;
      background: #d95f8d;
      color: white;
      font: inherit;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(217, 95, 141, 0.25);
    }

    #error-message {
      min-height: 22px;
      color: #b8325f;
      font-size: 0.92rem;
    }

    header {
      text-align: center;
      padding: 36px 18px 10px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(2.1rem, 8vw, 4.4rem);
      color: #d95f8d;
      text-shadow: 2px 2px 0 #fff;
    }

    header p {
      margin-top: 10px;
      font-size: 1.05rem;
      color: #8a5a64;
    }

    .board-wrapper {
      width: min(1120px, 94vw);
      margin: 24px auto 70px;
      padding: 30px;
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.45);
      box-shadow: 0 20px 50px rgba(217, 95, 141, 0.2);
      backdrop-filter: blur(8px);
    }

    .board {
      min-height: 60vh;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
      gap: 30px;
    }

    .polaroid {
      position: relative;
      height: 255px;
      perspective: 1000px;
      cursor: pointer;
      transition: transform 0.35s ease, z-index 0.2s ease;
    }

    .polaroid:hover {
      transform: translateY(-8px) scale(1.03) rotate(var(--card-rotate));
    }

    .polaroid.selected {
      z-index: 20;
      transform: scale(1.14) translateY(-12px) rotate(0deg);
    }

    .polaroid-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.85s cubic-bezier(.2,.8,.2,1);
    }

    .polaroid.selected .polaroid-inner {
      transform: rotateY(180deg);
    }

    .front,
    .back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 9px;
      background: #fffdf8;
      box-shadow: 0 12px 24px rgba(104, 62, 74, 0.18);
    }

    .front {
      padding: 12px 12px 48px;
    }

    .front::before {
      content: "♡";
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%) rotate(-8deg);
      background: #ffc8d8;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 18px;
      box-shadow: 0 5px 12px rgba(217, 95, 141, 0.25);
    }

    .front img {
      width: 100%;
      height: 165px;
      object-fit: cover;
      border-radius: 5px;
      display: block;
      filter: saturate(1.08) contrast(1.02);
    }

    .caption {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 13px;
      text-align: center;
      font-size: 0.95rem;
      color: #7b4a54;
    }

    .back {
      transform: rotateY(180deg);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background:
        linear-gradient(135deg, rgba(255, 235, 242, 0.96), rgba(255, 250, 229, 0.96)),
        #fff;
      border: 2px dashed #f3a6bd;
    }

    .back p {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.45;
      color: #6b3e4a;
      white-space: pre-wrap;
    }

    .floating-heart {
      position: fixed;
      bottom: -30px;
      font-size: 22px;
      opacity: 0.7;
      animation: floatUp 7s linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      15% {
        opacity: 0.8;
      }

      100% {
        transform: translateY(-110vh) rotate(240deg);
        opacity: 0;
      }
    }

    @media (max-width: 560px) {
      header {
        padding-top: 28px;
      }

      .board-wrapper {
        padding: 18px;
        border-radius: 26px;
      }

      .board {
        grid-template-columns: repeat(2, minmax(130px, 1fr));
        gap: 20px;
      }

      .polaroid {
        height: 225px;
      }

      .front {
        padding: 10px 10px 44px;
      }

      .front img {
        height: 140px;
      }

      .caption {
        font-size: 0.84rem;
      }

      .back {
        padding: 16px;
      }

      .back p {
        font-size: 0.92rem;
      }
    }
  </style>
</head>

<body>
  <div id="lock-screen">
    <div class="lock-card">
      <h1>For My Sunshine ☀️</h1>
      <p>Enter the secret word to open your surprise.</p>

      <input id="password-input" type="password" placeholder="Secret word" />
      <button onclick="unlockPage()">Open my heart</button>

      <p id="error-message"></p>
    </div>
  </div>

  <header>
    <h1>For My Sunshine ☀️</h1>
    <p>Tap a memory to reveal a little love note.</p>
  </header>

  <section class="board-wrapper">
    <main class="board" id="board"></main>
  </section>

  <script>
    /*
      Change this password before publishing.
      This is a simple front-end password gate.
      It is cute for privacy, but not strong security.
    */
    const SECRET_PASSWORD = "sunshine";

    /*
      Add your photos inside the /photos folder in GitHub.

      Example repository:
      for-my-sunshine/
        index.html
        photos/
          photo1.jpg
          photo2.jpg
          photo3.jpg

      Then add each photo here.
    */
    const memories = [
      {
        image: "photos/photo1.jpg",
        caption: "My favorite smile",
        text: "Every time you smile, my world gets softer."
      },
      {
        image: "photos/photo2.jpg",
        caption: "Our little moment",
        text: "You make even ordinary days feel like magic."
      },
      {
        image: "photos/photo3.jpg",
        caption: "My sunshine",
        text: "You are my favorite person, my peace, and my happy place."
      },
      {
        image: "photos/photo4.jpg",
        caption: "Us",
        text: "With you, even silence feels like home."
      }

      /*
        To add more photos, copy this block:

      ,
      {
        image: "photos/photo5.jpg",
        caption: "A title here",
        text: "Your cute hidden message here."
      }

      */
    ];

    const board = document.getElementById("board");

    function renderBoard() {
      board.innerHTML = "";

      memories.forEach((memory, index) => {
        const card = document.createElement("div");
        const rotations = [-5, 4, -3, 6, -6, 3, 5, -4];

        card.className = "polaroid";
        card.style.setProperty("--card-rotate", `${rotations[index % rotations.length]}deg`);
        card.style.transform = `rotate(${rotations[index % rotations.length]}deg)`;

        card.innerHTML = `
          <div class="polaroid-inner">
            <div class="front">
              <img src="${escapeAttribute(memory.image)}" alt="${escapeAttribute(memory.caption)}">
              <div class="caption">${escapeHTML(memory.caption)}</div>
            </div>

            <div class="back">
              <p>${escapeHTML(memory.text)}</p>
            </div>
          </div>
        `;

        card.addEventListener("click", () => {
          document.querySelectorAll(".polaroid").forEach(item => {
            if (item !== card) {
              item.classList.remove("selected");
            }
          });

          card.classList.toggle("selected");
        });

        board.appendChild(card);
      });
    }

    function unlockPage() {
      const input = document.getElementById("password-input");
      const error = document.getElementById("error-message");

      if (input.value.trim().toLowerCase() === SECRET_PASSWORD.toLowerCase()) {
        sessionStorage.setItem("sunshineUnlocked", "true");
        document.getElementById("lock-screen").style.display = "none";
      } else {
        error.textContent = "Wrong secret word, try again 💗";
        input.value = "";
      }
    }

    document.getElementById("password-input").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        unlockPage();
      }
    });

    window.addEventListener("load", function() {
      if (sessionStorage.getItem("sunshineUnlocked") === "true") {
        document.getElementById("lock-screen").style.display = "none";
      }

      renderBoard();
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "floating-heart";
      heart.textContent = ["♡", "💗", "🌸", "✨"][Math.floor(Math.random() * 4)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 5 + Math.random() * 4 + "s";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 9000);
    }

    setInterval(createHeart, 900);

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHTML(value);
    }
  </script>
</body>
</html>
