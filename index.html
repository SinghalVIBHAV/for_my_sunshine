<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Comic Sans MS", "Trebuchet MS", cursive;
    background:
      radial-gradient(circle at top left, #fff1f5, transparent 35%),
      radial-gradient(circle at bottom right, #ffe9c9, transparent 35%),
      linear-gradient(135deg, #fff7e6, #ffe6ef);
    overflow-x: hidden;
    color: #6b3e4a;
  }

  header {
    text-align: center;
    padding: 34px 18px 14px;
  }

  header h1 {
    margin: 0;
    font-size: clamp(2rem, 7vw, 4rem);
    color: #d95f8d;
    text-shadow: 2px 2px 0 #fff;
  }

  header p {
    margin-top: 10px;
    font-size: 1.05rem;
    color: #8a5a64;
  }

  .board {
    width: min(1100px, 94vw);
    margin: 20px auto 60px;
    padding: 28px;
    min-height: 70vh;
    border-radius: 32px;
    background: rgba(255, 255, 255, 0.45);
    box-shadow: 0 20px 50px rgba(217, 95, 141, 0.2);
    backdrop-filter: blur(8px);

    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 28px;
    align-items: start;

    position: relative;
  }

  .polaroid {
    position: relative;
    perspective: 1000px;
    cursor: pointer;
    transition: transform 0.35s ease, z-index 0.2s ease;
  }

  .polaroid:hover {
    transform: translateY(-8px) scale(1.03) !important;
  }

  .polaroid.selected {
    z-index: 20;
    transform: scale(1.08) translateY(-10px) !important;
  }

  .polaroid-inner {
    width: 100%;
    position: relative;
    display: grid;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(.2,.8,.2,1);
  }

  .polaroid.selected .polaroid-inner {
    transform: rotateY(180deg);
  }

  .front,
  .back {
    grid-area: 1 / 1;
    backface-visibility: hidden;
    border-radius: 8px;
    background: #fffdf8;
    box-shadow: 0 12px 24px rgba(104, 62, 74, 0.18);
  }

  .front {
    position: relative;
    padding: 12px 12px 52px;
  }

  .front::before {
    content: "♡";
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%) rotate(-8deg);
    background: #ffc8d8;
    color: #fff;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 18px;
    box-shadow: 0 5px 12px rgba(217, 95, 141, 0.25);
    z-index: 2;
  }

  .front img {
    width: 100%;
    height: auto;
    max-height: 360px;
    object-fit: contain;
    border-radius: 4px;
    display: block;
    filter: saturate(1.08) contrast(1.02);
    background: #fff6f9;
  }

  .caption {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 14px;
    text-align: center;
    font-size: 0.95rem;
    color: #7b4a54;
  }

  .back {
    transform: rotateY(180deg);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    min-height: 100%;
    background:
      linear-gradient(135deg, rgba(255, 235, 242, 0.95), rgba(255, 250, 229, 0.95)),
      #fff;
    border: 2px dashed #f3a6bd;
  }

  .back p {
    font-size: 1.08rem;
    line-height: 1.45;
    margin: 0;
  }

  .empty-message {
    grid-column: 1 / -1;
    text-align: center;
    color: #8a5a64;
    font-size: 1rem;
    padding: 40px 10px;
  }

  .floating-heart {
    position: fixed;
    bottom: -30px;
    font-size: 22px;
    opacity: 0.7;
    animation: floatUp 7s linear infinite;
    pointer-events: none;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 0;
    }

    15% {
      opacity: 0.8;
    }

    100% {
      transform: translateY(-110vh) rotate(240deg);
      opacity: 0;
    }
  }

  @media (max-width: 520px) {
    .board {
      grid-template-columns: repeat(2, minmax(130px, 1fr));
      gap: 20px;
      padding: 18px;
    }

    .front {
      padding: 10px 10px 46px;
    }

    .front img {
      max-height: 260px;
    }

    .caption {
      font-size: 0.85rem;
    }

    .back p {
      font-size: 0.95rem;
    }
  }
</style>
